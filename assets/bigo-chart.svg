<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" role="img" aria-label="Big-O complexity growth chart">
  <defs>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="46.875" height="42.5" patternUnits="userSpaceOnUse">
      <path d="M46.875 0H0V42.5" fill="none" stroke="#132235" stroke-width="1"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00eaff"/><stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <style>
      .curve { fill:none; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round;
               stroke-dasharray:1000; stroke-dashoffset:1000; filter:url(#g); }
      .c1{animation:draw 2.2s ease-out .1s forwards}
      .c2{animation:draw 2.2s ease-out .35s forwards}
      .c3{animation:draw 2.2s ease-out .6s forwards}
      .c4{animation:draw 2.2s ease-out .85s forwards}
      .c5{animation:draw 2.2s ease-out 1.1s forwards}
      @keyframes draw { to { stroke-dashoffset:0 } }
      @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
      .sw { animation:pulse 2s infinite ease-in-out }
      .tag { opacity:0; animation:fade .6s ease-out 2s forwards }
      @keyframes fade { to { opacity:1 } }
    </style>
  </defs>

  <rect width="900" height="480" fill="#080b12"/>
  <rect x="88" y="58" width="752" height="344" fill="url(#grid)"/>
  <rect x="88" y="58" width="752" height="344" fill="none" stroke="#1d3350" stroke-width="1.5" rx="4"/>

  <!-- title -->
  <text x="100" y="40" font-family="'Courier New',monospace" font-size="22" font-weight="bold" letter-spacing="3" fill="#e6f0ff">BIG&#8209;O &#8901; GROWTH vs INPUT SIZE</text>
  <circle cx="824" cy="34" r="5" fill="#00ff9d" class="sw"/>

  <!-- axes labels -->
  <text x="464" y="430" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" fill="#6f8bad">input size  n  &#8594;</text>
  <text x="64" y="230" font-family="'Courier New',monospace" font-size="15" fill="#6f8bad" transform="rotate(-90 64 230)" text-anchor="middle">operations  &#8593;</text>

  <!-- curves -->
  <path class="curve c1" stroke="#00ff9d" d="M90,394.7 L840,394.7"/>
  <path class="curve c2" stroke="#00eaff" d="M90,400 L183.8,400 L277.5,394.7 L371.3,391.6 L465,389.4 L558.8,387.7 L652.5,386.3 L746.3,385.1 L840,384.1"/>
  <path class="curve c3" stroke="#7b5cff" d="M90,400 L183.8,394.7 L277.5,389.4 L371.3,384.1 L465,378.8 L558.8,373.4 L652.5,368.1 L746.3,362.8 L840,357.5"/>
  <path class="curve c4" stroke="#ffb020" d="M90,400 L183.8,400 L277.5,389.4 L371.3,374.8 L465,357.5 L558.8,338.4 L652.5,317.7 L746.3,295.6 L840,272.5"/>
  <path class="curve c5" stroke="#ff2e97" d="M90,400 L183.8,394.7 L277.5,378.8 L371.3,352.2 L465,315 L558.8,267.2 L652.5,208.8 L746.3,139.7 L840,60"/>

  <!-- end tags -->
  <g class="tag" font-family="'Courier New',monospace" font-size="14" font-weight="bold">
    <text x="844" y="64"  fill="#ff2e97">O(n&#178;)</text>
    <text x="844" y="276" fill="#ffb020">O(n log n)</text>
    <text x="844" y="361" fill="#7b5cff">O(n)</text>
    <text x="844" y="388" fill="#00eaff">O(log n)</text>
    <text x="844" y="404" fill="#00ff9d">O(1)</text>
  </g>

  <!-- legend -->
  <g font-family="'Courier New',monospace" font-size="13" transform="translate(108,78)">
    <rect x="-6" y="-14" width="186" height="118" rx="6" fill="#0b1018" stroke="#1d3350"/>
    <line x1="4" y1="2"  x2="30" y2="2"  stroke="#ff2e97" stroke-width="3"/><text x="38" y="6"  fill="#c7d6ea">O(n&#178;) &#8212; quadratic</text>
    <line x1="4" y1="24" x2="30" y2="24" stroke="#ffb020" stroke-width="3"/><text x="38" y="28" fill="#c7d6ea">O(n log n)</text>
    <line x1="4" y1="46" x2="30" y2="46" stroke="#7b5cff" stroke-width="3"/><text x="38" y="50" fill="#c7d6ea">O(n) &#8212; linear</text>
    <line x1="4" y1="68" x2="30" y2="68" stroke="#00eaff" stroke-width="3"/><text x="38" y="72" fill="#c7d6ea">O(log n)</text>
    <line x1="4" y1="90" x2="30" y2="90" stroke="#00ff9d" stroke-width="3"/><text x="38" y="94" fill="#c7d6ea">O(1) &#8212; constant</text>
  </g>

  <!-- caption -->
  <text x="464" y="462" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#51708f">same problem &#8901; same answer &#8901; the curve decides ACCEPTED or TLE</text>
</svg>
