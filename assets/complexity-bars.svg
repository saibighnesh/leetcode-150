<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" role="img" aria-label="Complexity rating bars">
  <defs>
    <filter id="bg" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .bar { transform-box:fill-box; transform-origin:left center;
             animation:grow 1.3s cubic-bezier(.2,.85,.25,1) both; filter:url(#bg); }
      @keyframes grow { from { transform:scaleX(0) } to { transform:scaleX(1) } }
      .rt { animation:fade .5s ease both }
      @keyframes fade { from { opacity:.2 } to { opacity:1 } }
    </style>
  </defs>

  <rect width="900" height="450" fill="#080b12"/>
  <text x="24" y="40" font-family="'Courier New',monospace" font-size="22" font-weight="bold" letter-spacing="3" fill="#e6f0ff">COMPLEXITY &#8901; THREAT LEVEL</text>
  <line x1="24" y1="54" x2="876" y2="54" stroke="#1d3350" stroke-width="1.5"/>

  <!-- rows: label | track | fill | rating -->
  <g font-family="'Courier New',monospace">
    <!-- O(1) -->
    <text x="24" y="92" font-size="18" fill="#9fb6d4">O(1)</text>
    <rect x="200" y="78" width="500" height="22" rx="6" fill="#0f1826"/>
    <rect class="bar" x="200" y="78" width="30"  height="22" rx="6" fill="#00ff9d" style="animation-delay:.10s"/>
    <text class="rt" x="712" y="94" font-size="14" font-weight="bold" fill="#00ff9d" style="animation-delay:1.1s">EXCELLENT</text>

    <!-- O(log n) -->
    <text x="24" y="134" font-size="18" fill="#9fb6d4">O(log n)</text>
    <rect x="200" y="120" width="500" height="22" rx="6" fill="#0f1826"/>
    <rect class="bar" x="200" y="120" width="70"  height="22" rx="6" fill="#00eaff" style="animation-delay:.25s"/>
    <text class="rt" x="712" y="136" font-size="14" font-weight="bold" fill="#00eaff" style="animation-delay:1.2s">GREAT</text>

    <!-- O(n) -->
    <text x="24" y="176" font-size="18" fill="#9fb6d4">O(n)</text>
    <rect x="200" y="162" width="500" height="22" rx="6" fill="#0f1826"/>
    <rect class="bar" x="200" y="162" width="150" height="22" rx="6" fill="#8ae000" style="animation-delay:.40s"/>
    <text class="rt" x="712" y="178" font-size="14" font-weight="bold" fill="#8ae000" style="animation-delay:1.3s">GOOD</text>

    <!-- O(n log n) -->
    <text x="24" y="218" font-size="18" fill="#9fb6d4">O(n log n)</text>
    <rect x="200" y="204" width="500" height="22" rx="6" fill="#0f1826"/>
    <rect class="bar" x="200" y="204" width="225" height="22" rx="6" fill="#ffd029" style="animation-delay:.55s"/>
    <text class="rt" x="712" y="220" font-size="14" font-weight="bold" fill="#ffd029" style="animation-delay:1.4s">FAIR</text>

    <!-- O(n^2) -->
    <text x="24" y="260" font-size="18" fill="#9fb6d4">O(n&#178;)</text>
    <rect x="200" y="246" width="500" height="22" rx="6" fill="#0f1826"/>
    <rect class="bar" x="200" y="246" width="330" height="22" rx="6" fill="#ff8c1a" style="animation-delay:.70s"/>
    <text class="rt" x="712" y="262" font-size="14" font-weight="bold" fill="#ff8c1a" style="animation-delay:1.5s">SLOW</text>

    <!-- O(2^n) -->
    <text x="24" y="302" font-size="18" fill="#9fb6d4">O(2&#8319;)</text>
    <rect x="200" y="288" width="500" height="22" rx="6" fill="#0f1826"/>
    <rect class="bar" x="200" y="288" width="430" height="22" rx="6" fill="#ff3b3b" style="animation-delay:.85s"/>
    <text class="rt" x="712" y="304" font-size="14" font-weight="bold" fill="#ff3b3b" style="animation-delay:1.6s">AVOID</text>

    <!-- O(n!) -->
    <text x="24" y="344" font-size="18" fill="#9fb6d4">O(n!)</text>
    <rect x="200" y="330" width="500" height="22" rx="6" fill="#0f1826"/>
    <rect class="bar" x="200" y="330" width="500" height="22" rx="6" fill="#ff1744" style="animation-delay:1.0s"/>
    <text class="rt" x="712" y="346" font-size="14" font-weight="bold" fill="#ff1744" style="animation-delay:1.7s">AVOID</text>
  </g>

  <line x1="24" y1="378" x2="876" y2="378" stroke="#1d3350" stroke-width="1.5"/>
  <text x="24" y="404" font-family="'Courier New',monospace" font-size="14" fill="#6f8bad">TARGET ZONE &#8594; <tspan fill="#00ff9d">O(1)</tspan> &#8901; <tspan fill="#00eaff">O(log n)</tspan> &#8901; <tspan fill="#8ae000">O(n)</tspan> &#8901; <tspan fill="#ffd029">O(n log n)</tspan></text>
  <text x="24" y="428" font-family="'Courier New',monospace" font-size="14" fill="#6f8bad">DANGER ZONE &#8594; <tspan fill="#ff8c1a">O(n&#178;)</tspan> &#8901; <tspan fill="#ff3b3b">O(2&#8319;)</tspan> &#8901; <tspan fill="#ff1744">O(n!)</tspan>  &#8212; bombs on large n</text>
</svg>
