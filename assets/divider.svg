<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" role="presentation">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00eaff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7b5cff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="40" y1="12" x2="1160" y2="12" stroke="url(#dl)" stroke-width="2" filter="url(#dg)"/>
  <line x1="40" y1="12" x2="1160" y2="12" stroke="#00eaff" stroke-width="1" stroke-dasharray="4 10" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2s" repeatCount="indefinite"/>
  </line>
  <circle cy="12" r="4" fill="#00ff9d" filter="url(#dg)">
    <animate attributeName="cx" values="60;1140;60" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#00ff9d;#00eaff;#ff2e97;#00ff9d" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
