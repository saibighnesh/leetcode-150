<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" role="img" aria-label="Mission progress 0 of 150">
  <defs>
    <linearGradient id="fillg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00eaff"/><stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00eaff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00eaff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00eaff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pg" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="trackclip"><rect x="30" y="54" width="600" height="30" rx="8"/></clipPath>
    <style>
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.15} }
      .tick { animation:blink 1.1s infinite steps(1) }
    </style>
  </defs>

  <rect width="900" height="130" fill="#080b12"/>

  <!-- header -->
  <text x="30" y="36" font-family="'Courier New',monospace" font-size="18" font-weight="bold" letter-spacing="4" fill="#9fb6d4">MISSION PROGRESS</text>
  <text x="30" y="36" font-family="'Courier New',monospace" font-size="18" font-weight="bold" letter-spacing="4" fill="#00eaff" opacity="0.0">MISSION PROGRESS</text>

  <!-- track -->
  <rect x="30" y="54" width="600" height="30" rx="8" fill="#0d1726" stroke="#1d3350" stroke-width="1.5"/>

  <!-- segment dividers (30 segments = 5 problems each) -->
  <g stroke="#15233a" stroke-width="2">
    <line x1="50"  y1="56" x2="50"  y2="82"/><line x1="70"  y1="56" x2="70"  y2="82"/><line x1="90"  y1="56" x2="90"  y2="82"/>
    <line x1="110" y1="56" x2="110" y2="82"/><line x1="130" y1="56" x2="130" y2="82"/><line x1="150" y1="56" x2="150" y2="82"/>
    <line x1="170" y1="56" x2="170" y2="82"/><line x1="190" y1="56" x2="190" y2="82"/><line x1="210" y1="56" x2="210" y2="82"/>
    <line x1="230" y1="56" x2="230" y2="82"/><line x1="250" y1="56" x2="250" y2="82"/><line x1="270" y1="56" x2="270" y2="82"/>
    <line x1="290" y1="56" x2="290" y2="82"/><line x1="310" y1="56" x2="310" y2="82"/><line x1="330" y1="56" x2="330" y2="82"/>
    <line x1="350" y1="56" x2="350" y2="82"/><line x1="370" y1="56" x2="370" y2="82"/><line x1="390" y1="56" x2="390" y2="82"/>
    <line x1="410" y1="56" x2="410" y2="82"/><line x1="430" y1="56" x2="430" y2="82"/><line x1="450" y1="56" x2="450" y2="82"/>
    <line x1="470" y1="56" x2="470" y2="82"/><line x1="490" y1="56" x2="490" y2="82"/><line x1="510" y1="56" x2="510" y2="82"/>
    <line x1="530" y1="56" x2="530" y2="82"/><line x1="550" y1="56" x2="550" y2="82"/><line x1="570" y1="56" x2="570" y2="82"/>
    <line x1="590" y1="56" x2="590" y2="82"/><line x1="610" y1="56" x2="610" y2="82"/>
  </g>

  <!-- FILL: update width as you solve (width = solved/150 * 600). 0 now. -->
  <rect x="30" y="54" width="0" height="30" rx="8" fill="url(#fillg)" filter="url(#pg)"/>

  <!-- scan sweep over empty track -->
  <g clip-path="url(#trackclip)">
    <rect x="-140" y="54" width="140" height="30" fill="url(#scan)">
      <animate attributeName="x" from="-140" to="630" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- leading tick at current position (x = 30 + fill) -->
  <rect class="tick" x="30" y="50" width="3" height="38" fill="#00eaff" filter="url(#pg)"/>

  <!-- readout -->
  <text x="662" y="66" font-family="'Courier New',monospace" font-size="30" font-weight="bold" fill="#00eaff" filter="url(#pg)">0 / 150</text>
  <text x="662" y="88" font-family="'Courier New',monospace" font-size="16" fill="#7b5cff">0.0% COMPLETE</text>

  <!-- footer ticks -->
  <text x="30"  y="108" font-family="'Courier New',monospace" font-size="12" fill="#51708f">0</text>
  <text x="315" y="108" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#51708f">75</text>
  <text x="630" y="108" text-anchor="end" font-family="'Courier New',monospace" font-size="12" fill="#51708f">150</text>
</svg>
