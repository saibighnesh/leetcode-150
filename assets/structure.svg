<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Repository structure">
  <defs>
    <filter id="sg" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00eaff"/><stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <clipPath id="winclip"><rect x="30" y="58" width="840" height="320" rx="12"/></clipPath>
    <style>
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cur { animation:blink 1.1s infinite steps(1) }
      .ln { animation:appear .5s ease both }
      @keyframes appear { from { opacity:.2 } to { opacity:1 } }
    </style>
  </defs>

  <rect width="900" height="400" fill="#080b12"/>

  <!-- window -->
  <rect x="30" y="58" width="840" height="320" rx="12" fill="#0a0f18" stroke="url(#win)" stroke-width="1.8"/>
  <rect x="30" y="58" width="840" height="40" rx="12" fill="#0d1420"/>
  <rect x="30" y="86" width="840" height="12" fill="#0d1420"/>
  <circle cx="54" cy="78" r="6" fill="#ff5f56"/><circle cx="76" cy="78" r="6" fill="#ffbd2e"/><circle cx="98" cy="78" r="6" fill="#27c93f"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#6f8bad">~/leetcode-150</text>

  <!-- tree -->
  <g clip-path="url(#winclip)" font-family="'Courier New',monospace" font-size="16">
    <g fill="#3a4a60">
      <text class="ln" x="56"  y="134" style="animation-delay:.05s"><tspan fill="#00eaff" font-weight="bold">&#9660; leetcode-150/</tspan></text>
      <text class="ln" x="80"  y="160" style="animation-delay:.12s">&#9500;&#9472; <tspan fill="#9fb6d4">README.md</tspan>          <tspan fill="#51708f"># futuristic tracker</tspan></text>
      <text class="ln" x="80"  y="186" style="animation-delay:.19s">&#9500;&#9472; <tspan fill="#9fb6d4">LOG.md</tspan>             <tspan fill="#51708f"># daily journal</tspan></text>
      <text class="ln" x="80"  y="212" style="animation-delay:.26s">&#9500;&#9472; <tspan fill="#9fb6d4">.gitignore</tspan></text>
      <text class="ln" x="80"  y="238" style="animation-delay:.33s">&#9500;&#9472; <tspan fill="#00eaff" font-weight="bold">&#9654; assets/</tspan>         <tspan fill="#51708f"># banner + SVG graphics</tspan></text>
      <text class="ln" x="80"  y="264" style="animation-delay:.40s">&#9500;&#9472; <tspan fill="#00eaff" font-weight="bold">&#9654; scripts/</tspan></text>
      <text class="ln" x="112" y="290" style="animation-delay:.47s">&#9492;&#9472; <tspan fill="#9fb6d4">new.sh</tspan>         <tspan fill="#51708f"># scaffolds a problem</tspan></text>
      <text class="ln" x="80"  y="316" style="animation-delay:.54s">&#9492;&#9472; <tspan fill="#7b5cff" font-weight="bold">&#9660; NNNN-slug/</tspan>      <tspan fill="#51708f"># one folder per problem</tspan></text>
      <text class="ln" x="124" y="342" style="animation-delay:.61s">&#9500;&#9472; <tspan fill="#9fb6d4">README.md</tspan>  <tspan fill="#51708f">&#8901;</tspan>  <tspan fill="#ff8fc0">solution.py .java .cpp .js</tspan></text>
      <text class="ln" x="124" y="366" style="animation-delay:.68s">&#9492;&#9472; <tspan fill="#ff8fc0">.cs .go .ts .kt .rb</tspan>  <tspan fill="#51708f"># 9 languages</tspan><tspan class="cur" fill="#00ff9d" font-weight="bold"> &#9608;</tspan></text>
    </g>
  </g>
</svg>
